name: validate-swift

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-swift:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Resolve package dependencies
        run: swift package resolve

      - name: Build debug
        run: swift build -c debug

      - name: Build release
        run: swift build -c release

      # The suite is not decoration: ReaperSafetyTests and SessionLogContentTests
      # exist to make the destructive path impossible to regress.
      - name: Run Swift tests
        run: swift test

      # CI has no signing identity, so this also proves the bundle script's
      # unsigned path works and that LSUIElement survives into Info.plist —
      # without it the app would silently grow a Dock icon.
      - name: Assemble unsigned app bundle
        run: make bundle-unsigned

      - name: Verify the bundle is menu-bar-only
        run: |
          plist="dist/OpenZombr.app/Contents/Info.plist"
          test "$(plutil -extract LSUIElement raw "$plist")" = "true"
          plutil -extract CFBundleIdentifier raw "$plist"
          plutil -extract CFBundleShortVersionString raw "$plist"

      # --probe reads the live process table through sysctl. Running it here proves
      # the sampler works on a stock runner and never shells out to `ps`, which
      # would fork — the exact operation that fails in the condition being monitored.
      - name: Smoke-test the sampler against the runner's own process table
        run: ./dist/OpenZombr.app/Contents/MacOS/OpenZombr --probe
